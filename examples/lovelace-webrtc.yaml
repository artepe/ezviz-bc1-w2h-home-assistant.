# EZVIZ BC1 battery camera + W2H hub, Home Assistant OS / Pi 5.
# Full Raspberry Pi 5 proxy -> go2rtc -> Lovelace live playback verified 2026-10-11.
# Requires HACS AlexxIT/WebRTC integration connected to go2rtc.
# The url must match the stream name in examples/go2rtc.yaml.
# Manual Lovelace card; on-demand use is preferable for a battery camera.
# Video-only default. Use a separate temporary card for audio experiments; see docs/AUDIO.md.
type: vertical-stack
cards:
  - type: markdown
    content: |
      ## 📹 EZVIZ BC1 / W2H
      **Livekamera – Raspberry Pi 5**
      Videovirta: EZVIZ Cloud → go2rtc → WebRTC
  - type: custom:webrtc-camera
    url: ezviz_bc1
    mode: mse
    media: video
    ui: true
    muted: true
    title: EZVIZ BC1 – LIVE
