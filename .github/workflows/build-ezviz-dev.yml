name: Build and publish EZVIZ DEV images

on:
  pull_request:
    paths:
      - 'ezviz_bc1_w2h_dev/**'
      - 'tests/**'
      - 'tests_dev/**'
      - 'scripts/**'
      - '.github/workflows/build-ezviz-dev.yml'
  push:
    branches: [main, codex/dev-ghcr-prebuilt-images]
    paths:
      - 'ezviz_bc1_w2h_dev/**'
      - 'tests/**'
      - 'tests_dev/**'
      - 'scripts/**'
      - '.github/workflows/build-ezviz-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ezviz-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read version and image from the DEV manifest
        id: release
        run: python scripts/release_metadata.py --addon ezviz_bc1_w2h_dev >> "$GITHUB_OUTPUT"
      - name: Check release contract and existing stable app
        run: |
          python -m compileall -q ezviz_bc1_w2h_dev scripts tests tests_dev
          python -m unittest discover -s tests -v
      - name: Check DEV behavior without real credentials or cameras
        env:
          EZVIZ_TEST_ADDON: ezviz_bc1_w2h_dev
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests_dev -v

  build:
    name: Build and test ${{ matrix.arch }}
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            base: ghcr.io/home-assistant/aarch64-base:3.22
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            base: ghcr.io/home-assistant/amd64-base:3.22
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      IMAGE: ${{ needs.validate.outputs.image }}
      VERSION: ${{ needs.validate.outputs.version }}
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build locally on the matching GitHub runner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./ezviz_bc1_w2h_dev
          file: ./ezviz_bc1_w2h_dev/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:build-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_VERSION=${{ env.VERSION }}
            BUILD_ARCH=${{ matrix.arch }}
      - name: Test actual image labels, dependencies and SDK entry points
        run: python3 scripts/check_dev_container.py "$IMAGE:build-$GITHUB_SHA-$ARCH" "$VERSION" "$ARCH"
      - name: Run media and DEV regression tests inside the image
        run: |
          docker run --rm --network none --platform "$PLATFORM" \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" --workdir /workspace \
            --env EZVIZ_TEST_ADDON=ezviz_bc1_w2h_dev \
            --entrypoint /opt/ezviz-venv/bin/python "$IMAGE:build-$GITHUB_SHA-$ARCH" \
            -m unittest discover -s tests -v
          docker run --rm --network none --platform "$PLATFORM" \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" --workdir /workspace \
            --entrypoint /opt/ezviz-venv/bin/python "$IMAGE:build-$GITHUB_SHA-$ARCH" \
            -m unittest discover -s tests_dev -v
      - name: Test default s6 startup with synthetic Supervisor environment
        run: python3 scripts/check_container_environment.py "$IMAGE:build-$GITHUB_SHA-$ARCH" --platform "$PLATFORM"
      - name: Authenticate using the workflow token
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/dev-ghcr-prebuilt-images')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested commit-specific candidate
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/dev-ghcr-prebuilt-images')
        run: docker push "$IMAGE:build-$GITHUB_SHA-$ARCH"

  publish:
    name: Publish and verify the versioned multiarch image
    needs: [validate, build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/dev-ghcr-prebuilt-images')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.validate.outputs.image }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote only candidates whose builds and tests both passed
        run: |
          for arch in aarch64 amd64; do
            docker buildx imagetools create --prefer-index=false \
              -t "$IMAGE:$VERSION-$arch" "$IMAGE:build-$GITHUB_SHA-$arch"
          done
          docker buildx imagetools create -t "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-aarch64" "$IMAGE:$VERSION-amd64"
      - name: Verify tag matches manifest and both platforms are published
        run: |
          python3 scripts/release_metadata.py --addon ezviz_bc1_w2h_dev
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > /tmp/ezviz-manifest.json
          python3 scripts/check_dev_manifest.py /tmp/ezviz-manifest.json
      - name: Verify Supervisor can pull both platforms without registry credentials
        run: |
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          docker --config "$anonymous_config" pull --platform linux/arm64 "$IMAGE:$VERSION"
          docker --config "$anonymous_config" pull --platform linux/amd64 "$IMAGE:$VERSION"
