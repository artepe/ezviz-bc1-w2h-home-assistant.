name: EZVIZ Python regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile source and tests
        run: python -m compileall -q ezviz_bc1_w2h tests scripts
      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v
