name: Build EZVIZ BC1 W2H image for Raspberry Pi 5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ezviz-image.yml'
      - 'ezviz_bc1_w2h/**'
      - 'tests/**'
      - 'scripts/release_metadata.py'

permissions:
  contents: read
  packages: write

concurrency:
  group: ezviz-bc1-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build and publish linux/arm64 image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read app release metadata
        id: release
        run: python3 scripts/release_metadata.py >> "$GITHUB_OUTPUT"
      - name: Check camera configuration, persistence, ingress and supervision
        run: python3 -m unittest discover -s tests -v
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Raspberry Pi 5 image
        uses: docker/build-push-action@v6
        with:
          context: ./ezviz_bc1_w2h
          file: ./ezviz_bc1_w2h/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.release.outputs.version }}
            BUILD_ARCH=aarch64
      - name: Check published image (Python CLI, FFmpeg and audio detection)
        run: |
          docker run --rm --platform linux/arm64 --entrypoint /opt/ezviz-venv/bin/pyezvizapi "$IMAGE:$VERSION" --help >/dev/null
          docker run --rm --platform linux/arm64 --entrypoint /usr/bin/ffmpeg "$IMAGE:$VERSION" -version
          docker run --rm --platform linux/arm64 --entrypoint /usr/bin/ffprobe "$IMAGE:$VERSION" -version
          docker run --rm --platform linux/arm64 --entrypoint /opt/ezviz-venv/bin/python "$IMAGE:$VERSION" -c 'import sys; sys.path.insert(0, "/app"); import camera_config, supervisor_client, web, runner; from pathlib import Path; assert (Path("/app/static/index.html")).is_file()'
          docker run --rm --platform linux/arm64 --volume "$PWD/tests:/tests:ro" --env PYTHONPATH=/app --entrypoint /opt/ezviz-venv/bin/python "$IMAGE:$VERSION" -m unittest discover -s /tests -p test_audio_probe.py -v
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
