name: Build EZVIZ BC1 W2H image for Raspberry Pi 5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ezviz-image.yml'
      - 'ezviz_bc1_w2h/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: ezviz-bc1-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build and publish linux/arm64 image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Raspberry Pi 5 image
        uses: docker/build-push-action@v6
        with:
          context: ./ezviz_bc1_w2h
          file: ./ezviz_bc1_w2h/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/artepe/ezviz-bc1-w2h:0.1.2
          build-args: |
            BUILD_VERSION=0.1.2
            BUILD_ARCH=aarch64
      - name: Check published image (Python CLI and FFmpeg)
        run: |
          docker run --rm --platform linux/arm64 --entrypoint /opt/ezviz-venv/bin/pyezvizapi ghcr.io/artepe/ezviz-bc1-w2h:0.1.2 --help >/dev/null
          docker run --rm --platform linux/arm64 --entrypoint /usr/bin/ffmpeg ghcr.io/artepe/ezviz-bc1-w2h:0.1.2 -version | head -n 1
