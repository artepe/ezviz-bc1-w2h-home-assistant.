name: Build original EZVIZ BC1 legacy test image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ezviz_bc1_legacy/**'
      - '.github/workflows/build-ezviz-legacy.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: ezviz-bc1-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:3.22
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:3.22
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build original cloud proxy and publish architecture tag
        uses: docker/build-push-action@v7
        with:
          context: ./ezviz_bc1_legacy
          file: ./ezviz_bc1_legacy/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/artepe/ezviz-bc1-legacy:0.1.2-${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=0.1.2

  publish:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture original cloud proxy image
        run: |
          docker buildx imagetools create \
            -t ghcr.io/artepe/ezviz-bc1-legacy:0.1.2 \
            ghcr.io/artepe/ezviz-bc1-legacy:0.1.2-aarch64 \
            ghcr.io/artepe/ezviz-bc1-legacy:0.1.2-amd64
          docker buildx imagetools inspect ghcr.io/artepe/ezviz-bc1-legacy:0.1.2
