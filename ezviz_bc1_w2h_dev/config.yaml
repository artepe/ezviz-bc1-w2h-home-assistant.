name: "EZVIZ BC1 / W2H DEV - Local or Cloud"
version: "0.3.3"
slug: "ezviz_bc1_w2h_dev"
image: "ghcr.io/artepe/ezviz-bc1-w2h"
description: "Explicit local-only or EZVIZ cloud connection; local W2H video/audio is experimental"
url: "https://github.com/artepe/ezviz-bc1-w2h-home-assistant."
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
host_network: true
ingress: true
ingress_port: 8788
panel_icon: mdi:cctv
panel_title: EZVIZ Cameras
panel_admin: true
hassio_api: true
hassio_role: default
options:
  connection_mode: local_only
  camera_serial: ""
  camera_serial_2: ""
  cameras: []
  username: ""
  password: ""
  force_relogin: false
  restart_delay: 30
  hybrid_mode: "auto"
  lan_hub_ip: ""
  lan_cas_serial: ""
schema:
  connection_mode: list(local_only|cloud)
  camera_serial: str
  camera_serial_2: str
  cameras:
    - name: "str(1,80)"
      serial: str
      port: "int(8558,8573)"
  username: str
  password: password
  force_relogin: bool
  restart_delay: "int(10,300)"
  hybrid_mode: "list(auto|local|cloud)"
  lan_hub_ip: str
  lan_cas_serial: str
